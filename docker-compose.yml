services:
  postgres:
    image: postgres:16-alpine
    container_name: ethio_pos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ethio_pos_db
    ports:
      - "5433:5432"
    volumes:
      - ethio_pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ethio_pos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ethio_pos_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ethio_pos_db?schema=public"
      PORT: 3001
      JWT_SECRET: "ethio_pos_dev_jwt_secret_key_2026_secure"
      JWT_EXPIRATION: "30d"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ethio_pos_pgdata:
    driver: local
